<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QR Bin</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">QR Bin</h1>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></span>
    </header>
    <main>
      <div class="panel" id="qrPanel">
        <div class="qr-row">
          <div class="qr-box"><img id="qrImg" alt="QR code" /></div>
          <div class="qr-side">
            <div class="link" id="linkText"></div>
            <div class="hint" id="hint"></div>
          </div>
        </div>
      </div>
      <div class="panel mobile" style="flex:1; display:flex; flex-direction:column;">
        <textarea id="text" placeholder="Everything typed here—on this screen or on your phone—stays in sync." spellcheck="false"></textarea>
        <div class="count" id="count">0 characters</div>
      </div>
    </main>
  </div>

<script src="/app.js"></script>
</body>
</html>
