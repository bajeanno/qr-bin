<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QR Bin</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    margin: 0 auto;
    padding: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 4px 16px;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
  }
  .dot.on { background: var(--green); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .qr-row {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .qr-box {
    background: #fff;
    border-radius: 10px;
    padding: 10px;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .qr-box img { width: 100%; height: 100%; display: block; }
  .qr-side { flex: 1; min-width: 240px; }
  .qr-side .link {
    word-break: break-all;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 6px; }
  textarea {
    width: 100%;
    flex: 1;
    min-height: 200px;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.5;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .count {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    padding-top: 8px;
  }
  .mobile {
    height: auto;
    min-height: 0;
    padding: 16px;
  }
  @media (min-width: 640px) {
    .mobile textarea { min-height: 60vh; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">QR Bin</h1>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></span>
    </header>
    <main>
      <div class="panel" id="qrPanel">
        <div class="qr-row">
          <div class="qr-box"><img id="qrImg" alt="QR code" /></div>
          <div class="qr-side">
            <div class="link" id="linkText"></div>
            <div class="hint" id="hint"></div>
          </div>
        </div>
      </div>
      <div class="panel mobile" style="flex:1; display:flex; flex-direction:column;">
        <textarea id="text" placeholder="Everything typed here—on this screen or on your phone—stays in sync." spellcheck="false"></textarea>
        <div class="count" id="count">0 characters</div>
      </div>
    </main>
  </div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var role = params.get("role") === "writer" ? "writer" : "host";
  var room = params.get("room") || "";

  var el = {
    dot: document.getElementById("dot"),
    status: document.getElementById("statusText"),
    qr: document.getElementById("qrImg"),
    link: document.getElementById("linkText"),
    hint: document.getElementById("hint"),
    text: document.getElementById("text"),
    count: document.getElementById("count"),
  };
  var qrPanel = document.getElementById("qrPanel");

  function setStatus(text, on) {
    el.status.textContent = text;
    el.dot.className = "dot" + (on ? " on" : "");
  }

  var ws = null;

  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host + "/ws?room=" + encodeURIComponent(room) + "&role=" + role);
    ws.onopen = function () { setStatus("connected", true); };
    ws.onerror = function () { setStatus("reconnecting…", false); };
    ws.onclose = function () {
      setStatus("reconnecting…", false);
      setTimeout(connect, 2000);
    };
    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "set" && typeof msg.text === "string") {
        if (el.text.value !== msg.text) {
          el.text.value = msg.text;
          updateCount();
        }
      } else if (msg.type === "peers" && typeof msg.n === "number") {
        if (role === "writer") {
          setStatus("connected (" + (msg.n - 1) + " viewer" + (msg.n - 1 === 1 ? "" : "s") + ")", true);
        } else {
          var others = msg.n - 1;
          setStatus(others ? others + " device" + (others === 1 ? "" : "s") + " connected" : "scan the code on your phone", true);
        }
      }
    };
  }

  // Debounced send of current text (both directions; last write wins).
  var timer = null;
  function push() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set", text: el.text.value }));
      }
    }, 150);
  }

  function updateCount() {
    var n = el.text.value.length;
    el.count.textContent = n + (n === 1 ? " character" : " characters");
  }

  el.text.addEventListener("input", function () {
    updateCount();
    push();
  });

  // --- host setup: build the QR code ---
  function uid() {
    try {
      if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "").slice(0, 20);
    } catch (e) {}
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  if (role === "host") {
    // Generate room, point the QR at the writer URL on the same origin.
    room = uid();
    var base = location.pathname.replace(/\/+$/, "");
    var writerUrl = location.origin + base + "?role=writer&room=" + encodeURIComponent(room);
    var short = writerUrl.length > 120 ? writerUrl.slice(0, 120) + "…" : writerUrl;
    el.link.textContent = short;
    el.hint.textContent = "Scan this code with your phone to open the writer. Type on your phone and it appears here instantly.";
    el.qr.src = "/qr.svg?data=" + encodeURIComponent(writerUrl);
    el.qr.onerror = function () { el.hint.textContent = "Could not load QR image."; };
    el.text.placeholder = "Waiting for your phone to connect…";
  } else {
    // Writer: no QR needed.
    qrPanel.style.display = "none";
    el.text.placeholder = "Type here… it appears on the computer instantly.";
    document.title = "QR Bin — writer";
  }

  connect();
})();
</script>
</body>
</html>
